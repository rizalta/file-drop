<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Box Front Gradient -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Box Top Gradient -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Box Right Gradient -->
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Glowing Cyan Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Flame Accent Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Base Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Motion Downward Speed Lines -->
  <path d="M190 80 L190 140 M322 80 L322 140 M256 50 L256 120" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.4"/>

  <!-- Isometric Package Base -->
  <g transform="translate(0, 40)">
    <!-- Top Face -->
    <polygon points="256,120 376,180 256,240 136,180" fill="url(#boxTop)"/>
    
    <!-- Left Face -->
    <polygon points="136,180 256,240 256,370 136,310" fill="url(#boxFront)"/>
    
    <!-- Right Face -->
    <polygon points="256,240 376,180 376,310 256,370" fill="url(#boxRight)"/>
    
    <!-- Box Flap & Tape Detail -->
    <polygon points="256,120 316,150 256,180 196,150" fill="#C4B5FD" opacity="0.3"/>
    <path d="M256 120 L256 240" stroke="#6D28D9" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Glowing Download Arrow Overlay -->
  <g filter="url(#cyanGlow)">
    <path d="M256 150 L256 310 M200 260 L256 316 L312 260" fill="none" stroke="url(#arrowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flame Accent (Representing Burn After Download) -->
  <g transform="translate(330, 290) scale(0.8)">
    <path d="M20 0 C20 0 35 25 35 40 C35 55 25 65 10 65 C-5 65 -15 55 -15 40 C-15 25 0 10 0 10 C0 10 5 25 10 30 C15 25 20 0 20 0 Z" fill="url(#flameGrad)" opacity="0.9"/>
  </g>
</svg>
